			<h1 id="quiz-vds-vl">Quiz VDS-VL</h1>
<script>
async function loadQuiz() {
    const response = await fetch('/quiz_data.json');
    const questions = await response.json();
    const selectedQuestions = questions.sort(() => 0.5 - Math.random()).slice(0, 70);
    const quizContainer = document.getElementById("quiz");
    quizContainer.innerHTML = "";

    selectedQuestions.forEach((q, index) => {
        const questionBlock = document.createElement("div");
        questionBlock.innerHTML = `
            <p><strong>${index + 1}. ${q.question}</strong></p>
            ${q.answers.map((a, i) => `<label><input type='radio' name='q${index}' value='${i}'> ${a}</label><br>`).join("")}
            <br>
        `;
        quizContainer.appendChild(questionBlock);
    });

    quizContainer.innerHTML += `<button onclick="checkAnswers()">Invia Risposte</button>`;
}

function checkAnswers() {
    const response = document.getElementById("quiz-result");
    response.innerHTML = "";
    fetch('/quiz_data.json')
        .then(res => res.json())
        .then(questions => {
            const selectedQuestions = questions.sort(() => 0.5 - Math.random()).slice(0, 70);
            let correct = 0, wrong = 0;
            let wrongAnswers = [];

            selectedQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name='q${index}']:checked`);
                if (selected) {
                    if (parseInt(selected.value) === q.correct) {
                        correct++;
                    } else {
                        wrong++;
                        wrongAnswers.push({question: q.question, correctAnswer: q.answers[q.correct]});
                    }
                } else {
                    wrong++;
                    wrongAnswers.push({question: q.question, correctAnswer: q.answers[q.correct]});
                }
            });

            response.innerHTML = `<p>Risposte Corrette: ${correct}</p><p>Risposte Errate: ${wrong}</p>`;
            if (wrongAnswers.length) {
                response.innerHTML += "<h3>Domande Sbagliate:</h3><ul>";
                wrongAnswers.forEach(w => {
                    response.innerHTML += `<li><strong>${w.question}</strong><br>Risposta corretta: ${w.correctAnswer}</li>`;
                });
                response.innerHTML += "</ul>";
            }
        });
}

document.addEventListener("DOMContentLoaded", loadQuiz);
</script>
<div id="quiz">Caricamento quiz...</div>
<div id="quiz-result"></div>
